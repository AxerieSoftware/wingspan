# Merges Dependabot's patch and minor bumps once the PR's other checks pass. Major bumps are left
# open for review. Branches here aren't protected, so GitHub won't hold a merge for CI on its own;
# the job waits for the other checks itself.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Give the other workflows a moment to register their checks.
          sleep 30
          others='[.[] | select(.workflow != "Dependabot auto-merge")]'
          while [ "$(gh pr checks "$PR_URL" --json workflow,bucket --jq "$others | map(select(.bucket == \"pending\")) | length" || true)" != 0 ]; do
            sleep 30
          done
          failed=$(gh pr checks "$PR_URL" --json workflow,bucket --jq "$others | map(select(.bucket == \"fail\" or .bucket == \"cancel\")) | length" || true)
          if [ "$failed" != 0 ]; then
            echo "Other checks failed; leaving the PR open."
            exit 1
          fi
          gh pr merge --squash "$PR_URL"
