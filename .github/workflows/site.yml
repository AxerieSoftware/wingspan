name: Site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # The tour and feature clips aren't in git: they're recorded here from the e2e tests' made-up household, and
      # kept until the extension or the recordings change. A page whose clip failed to record shows its screenshot.
      - name: Restore videos
        id: videos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/public/videos
          key: videos-${{ hashFiles('src/**', 'entrypoints/**', 'public/**', 'tests/e2e/**', 'package-lock.json', 'wxt.config.ts') }}

      - name: Install the extension's dependencies
        if: steps.videos.outputs.cache-hit != 'true'
        working-directory: .
        run: npm ci

      - name: Install Playwright Chromium and ffmpeg
        if: steps.videos.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          npx playwright install chromium
          command -v ffmpeg || sudo apt-get install -y ffmpeg

      - name: Get today's date
        if: steps.videos.outputs.cache-hit != 'true'
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Monarch snapshot
        if: steps.videos.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.monarch-snapshot
          key: monarch-snapshot-${{ steps.date.outputs.today }}

      # Each video is saved as it's recorded, so one that fails leaves the others in place.
      - name: Record videos
        id: record
        if: steps.videos.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: .
        run: npm run videos

      # Only a full set is kept, so a failed recording is tried again on the next deploy.
      - name: Save videos
        if: steps.record.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/public/videos
          key: ${{ steps.videos.outputs.cache-primary-key }}

      - name: Install dependencies
        run: npm ci

      - name: Stub WXT's tsconfig
        run: test -f ../.wxt/tsconfig.json || (mkdir -p ../.wxt && echo '{}' > ../.wxt/tsconfig.json)

      - name: Build site
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
