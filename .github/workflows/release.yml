name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Zip all builds
        run: npm run zip:all

      - name: Upload zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips
          # The sources zip Firefox's build adds is for an AMO review, which Wingspan doesn't go through yet.
          path: |
            .output/*-chrome.zip
            .output/*-edge.zip
            .output/*-firefox.zip
            .output/*-safari.zip
          if-no-files-found: error
          # .output is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zips

      # A draft, so nothing is public until the notes are written and it's published by hand. --notes goes above the generated notes.
      - name: Create draft GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" *.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --draft
          --generate-notes
          --notes "Unpacked builds for Chrome, Edge, Firefox and Safari (experimental). How to load each: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install"
        env:
          GH_TOKEN: ${{ github.token }}


  # Uploads the Chrome zip and submits it for review; Chrome publishes it once approved. Edge installs from this listing too.
  chrome-web-store:
    needs: package
    runs-on: ubuntu-latest
    # The environment holds the store's secrets, so only release tags can read them.
    environment: chrome-web-store
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zips
          path: zips

      - name: Upload to the Chrome Web Store
        run: npx wxt submit --chrome-zip zips/*-chrome.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: jpbbafooilhlohnnmioddafboidfjepn
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
