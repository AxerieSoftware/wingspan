name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Zip all builds
        run: npm run zip:all

      - name: Upload zips
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zips
          # The sources zip Firefox's build adds is for an AMO review, which Wingspan doesn't go through yet.
          path: |
            .output/*-chrome.zip
            .output/*-edge.zip
            .output/*-firefox.zip
            .output/*-safari.zip
          if-no-files-found: error
          # .output is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zips
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zips

      # A draft, so nothing is public until the notes are written and it's published by hand. --notes goes above the generated notes.
      - name: Create draft GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" *.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --draft
          --generate-notes
          --notes "Unpacked builds for Chrome, Edge, Firefox and Safari (experimental). How to load each: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install"
        env:
          GH_TOKEN: ${{ github.token }}

