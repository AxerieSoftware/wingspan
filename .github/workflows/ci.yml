name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  # Daily, so a Monarch release that breaks Wingspan shows up without a push.
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Find unused code
        run: npm run knip

      - name: Unit tests
        run: npm test

  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner image ships Chrome and Chromium, so their system libraries are already there and apt's slow mirror is skipped.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Ensure classes exist in Monarch
        run: npm run ensure:classes

      - name: Get today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Keyed by day, so the daily run still tests a Monarch release from the last day.
      - name: Cache Monarch snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.monarch-snapshot
          key: monarch-snapshot-${{ steps.date.outputs.today }}

      - name: End-to-end tests
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: tests/test-results/
          retention-days: 7

  # Playwright can't load extensions into Firefox, so only the smoke tests run there. They load and save Wingspan's data.
  e2e-firefox:
    name: e2e (Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner image ships Firefox, so its system libraries are already there and apt's slow mirror is skipped.
      - name: Install Playwright Firefox
        run: npx playwright install firefox
        timeout-minutes: 5

      - name: Get today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Monarch snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.monarch-snapshot
          key: monarch-snapshot-${{ steps.date.outputs.today }}

      - name: End-to-end tests in Firefox
        run: npm run e2e:firefox
        env:
          E2E_DEBUG: 1

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-firefox
          path: tests/test-results/
          retention-days: 7

  # Playwright's Docker image must match the installed Playwright exactly, so its tag comes from the lockfile.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read Playwright's version
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  # Safari and Orion are WebKit. The runner image lacks WebKit's system libraries, and Playwright's image has them.
  e2e-webkit:
    name: e2e (WebKit ${{ matrix.shard }}/2)
    needs: playwright-version
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Monarch snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.monarch-snapshot
          key: monarch-snapshot-${{ steps.date.outputs.today }}

      - name: End-to-end tests in WebKit
        run: npm run e2e:webkit -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-webkit-${{ matrix.shard }}
          path: tests/test-results/
          retention-days: 7

  # The ruleset requires one "e2e" check, whatever the shard count.
  e2e:
    needs: [e2e-shard, e2e-firefox, e2e-webkit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        run: test "${{ needs.e2e-shard.result }}" = success && test "${{ needs.e2e-firefox.result }}" = success && test "${{ needs.e2e-webkit.result }}" = success
